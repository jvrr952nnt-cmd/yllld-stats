name: browser-probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node probe-browser.cjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser-probe.json
          git commit -m 'browser probe' || true
          git push || true
